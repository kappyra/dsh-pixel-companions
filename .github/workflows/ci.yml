name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated client is up to date
        run: |
          npm run build
          git diff --exit-code -- client.js src/client/assets.generated.ts
      - name: Unit tests
        run: npm test
      - name: Documentation
        run: npm run check:docs
